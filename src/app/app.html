<div class="min-h-full">
  <nav class="border-b border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
    <div
      class="mx-auto flex max-w-3xl items-center justify-between gap-2 px-4 py-3"
      [class.max-lg:pr-20]="version()"
    >
      <a routerLink="/" class="text-sm font-semibold text-slate-900 dark:text-slate-100">CodeRAG</a>
      <div class="flex items-center gap-4">
        <a
          routerLink="/projects"
          class="text-sm text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-slate-100"
        >
          Projects
        </a>
        <a
          routerLink="/settings"
          class="text-sm text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-slate-100"
        >
          Settings
        </a>
      </div>
    </div>
  </nav>

  <router-outlet />
</div>

@if (version()) {
  <span
    class="pointer-events-none fixed right-0 top-0 z-40 rounded-bl-md bg-white/90 px-2 py-1 font-mono text-xs text-slate-400 shadow-sm dark:bg-slate-800/90 dark:text-slate-500"
  >
    Versão: {{ version() }}
  </span>
}

<app-toast-container />

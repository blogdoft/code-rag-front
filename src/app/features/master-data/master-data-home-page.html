<div class="mx-auto flex max-w-3xl flex-col gap-6 px-4 py-8">
  <header class="flex flex-col gap-1">
    <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-100">Master data</h1>
    <p class="text-sm text-slate-600 dark:text-slate-300">
      Catalogs that documents are classified with. Pick one to manage its entries.
    </p>
  </header>

  <section class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    @for (card of cards; track card.path) {
      <a
        [routerLink]="card.path"
        class="flex flex-col gap-1 rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition hover:border-sky-400 hover:shadow-md dark:border-slate-700 dark:bg-slate-800 dark:hover:border-sky-500"
      >
        <span class="text-sm font-medium text-slate-900 dark:text-slate-100">{{ card.label }}</span>
        <span class="text-sm text-slate-600 dark:text-slate-300">{{ card.description }}</span>
      </a>
    }
  </section>
</div>

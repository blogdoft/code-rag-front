<div
  class="flex max-h-[90vh] w-[min(90vw,56rem)] flex-col rounded-lg bg-slate-50 shadow-xl dark:bg-slate-900"
>
  <header
    class="flex items-center justify-between gap-4 border-b border-slate-200 px-5 py-4 dark:border-slate-700"
  >
    <h2 class="text-base font-medium text-slate-900 dark:text-slate-100">Projects</h2>
    <button
      type="button"
      (click)="close()"
      class="shrink-0 rounded-md p-1 text-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700"
      aria-label="Close"
    >
      &times;
    </button>
  </header>

  <div class="min-h-0 overflow-auto">
    <app-projects-page />
  </div>
</div>

<div class="flex max-h-[90vh] w-[min(90vw,32rem)] flex-col rounded-lg bg-white shadow-xl dark:bg-slate-800">
  <header class="border-b border-slate-200 px-5 py-4 dark:border-slate-700">
    <h2 class="text-base font-medium text-slate-900 dark:text-slate-100">
      {{ isEditMode ? 'Edit project' : 'Add project' }}
    </h2>
  </header>

  <div class="flex min-h-0 flex-col gap-4 overflow-auto px-5 py-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
      <input
        type="text"
        [value]="name()"
        [appEscClearable]="name()"
        (cleared)="clearName()"
        (input)="name.set($any($event.target).value)"
        (keydown.enter)="save()"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Git URL</label>
      <input
        type="text"
        placeholder="https://github.com/org/repo.git"
        [value]="gitUrl()"
        [appEscClearable]="gitUrl()"
        (cleared)="clearGitUrl()"
        (input)="gitUrl.set($any($event.target).value)"
        (keydown.enter)="save()"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Git Raw URL</label>
      <input
        type="text"
        placeholder="https://raw.githubusercontent.com/org/repo"
        [value]="gitRawUrl()"
        [appEscClearable]="gitRawUrl()"
        (cleared)="clearGitRawUrl()"
        (input)="gitRawUrl.set($any($event.target).value)"
        (keydown.enter)="save()"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      />
    </div>
  </div>

  <footer class="flex shrink-0 justify-end gap-2 border-t border-slate-200 px-5 py-3 dark:border-slate-700">
    <button
      type="button"
      (click)="cancel()"
      class="rounded-md px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700"
    >
      Cancel
    </button>
    <button
      type="button"
      [disabled]="!canSave"
      (click)="save()"
      class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSaving() ? 'Saving...' : 'Save' }}
    </button>
  </footer>
</div>

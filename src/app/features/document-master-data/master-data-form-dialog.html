<div
  class="flex max-h-[90vh] w-[min(90vw,28rem)] flex-col rounded-lg bg-white shadow-xl dark:bg-slate-800"
>
  <header class="border-b border-slate-200 px-5 py-4 dark:border-slate-700">
    <h2 class="text-base font-medium text-slate-900 dark:text-slate-100">
      {{ isEditMode ? 'Edit ' : 'Add ' }}{{ config.singular }}
    </h2>
  </header>

  <div class="flex flex-col gap-3 px-5 py-4">
    <div>
      <label
        for="master-data-value"
        class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
        >{{ config.fieldLabel }}</label
      >
      <input
        id="master-data-value"
        type="text"
        [placeholder]="config.placeholder"
        [value]="value()"
        [appEscClearable]="value()"
        (cleared)="value.set('')"
        (input)="value.set($any($event.target).value)"
        (keydown.enter)="save()"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      />
    </div>
    @if (validationError(); as error) {
      <p class="text-sm text-slate-500 dark:text-slate-400">{{ error }}</p>
    }
  </div>

  <footer
    class="flex shrink-0 justify-end gap-2 border-t border-slate-200 px-5 py-3 dark:border-slate-700"
  >
    <button
      type="button"
      (click)="cancel()"
      class="rounded-md px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700"
    >
      Cancel
    </button>
    <button
      type="button"
      [disabled]="!canSave()"
      (click)="save()"
      class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSaving() ? 'Saving...' : 'Save' }}
    </button>
  </footer>
</div>

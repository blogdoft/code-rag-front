<div
  class="flex max-h-[90vh] w-[min(90vw,48rem)] flex-col rounded-lg bg-white shadow-xl dark:bg-slate-800"
>
  <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 dark:border-slate-700">
    <div class="min-w-0">
      <p class="truncate text-base font-medium text-slate-900 dark:text-slate-100">
        {{ result.sourceFile ?? 'Unknown file' }}
      </p>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        {{ result.kind }}
        @if (result.typeName) {
          &middot; {{ result.typeName }}
        }
        @if (result.member) {
          &middot; {{ result.member }}
        }
        &middot; similarity {{ result.similarity | number: '1.0-3' }}
      </p>
    </div>
    <button
      type="button"
      (click)="close()"
      class="shrink-0 rounded-md p-1 text-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700"
      aria-label="Close"
    >
      &times;
    </button>
  </header>

  <div class="min-h-0 overflow-auto px-5 py-4">
    <pre class="whitespace-pre-wrap break-words font-mono text-sm text-slate-800 dark:text-slate-200">{{
      result.embeddingText
    }}</pre>
  </div>

  <footer class="flex shrink-0 justify-end border-t border-slate-200 px-5 py-3 dark:border-slate-700">
    <button
      type="button"
      (click)="close()"
      class="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700"
    >
      OK
    </button>
  </footer>
</div>

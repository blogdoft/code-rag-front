<div class="w-full max-w-sm rounded-lg bg-white p-5 shadow-xl dark:bg-slate-800">
  <h2 class="text-base font-medium text-slate-900 dark:text-slate-100">What's your name?</h2>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
    Used to identify you when you give feedback on a search result. You can change this later in Settings.
  </p>

  <input
    type="text"
    placeholder="Ada Lovelace"
    [value]="data.name()"
    [appEscClearable]="data.name()"
    (cleared)="clearName()"
    (input)="onNameInput($any($event.target).value)"
    (keydown.enter)="confirm()"
    class="mt-3 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
  />

  <div class="mt-4 flex justify-end gap-2">
    <button
      type="button"
      (click)="cancel()"
      class="rounded-md px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700"
    >
      Cancel
    </button>
    <button
      type="button"
      [disabled]="!canConfirm"
      (click)="confirm()"
      class="rounded-md bg-sky-600 px-3 py-1.5 text-sm text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Confirm
    </button>
  </div>
</div>

<div class="mx-auto flex max-w-4xl flex-col gap-6 px-4 py-8">
  <section class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <app-combobox
      label="Project"
      placeholder="Search projects..."
      [options]="projectOptions()"
      [(value)]="selectedProjectId"
    />

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Question</label>
      <input
        type="text"
        placeholder="Where is the retry logic for failed payments?"
        [value]="question()"
        [appEscClearable]="question()"
        (cleared)="clearQuestion()"
        (input)="onQuestionInput($any($event.target).value)"
        (keydown.enter)="submit()"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
      />
    </div>

    <button
      type="button"
      [disabled]="!canSubmit"
      (click)="submit()"
      class="self-start rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Asking...' : 'Ask' }}
    </button>
  </section>

  <section class="flex flex-col gap-4">
    @for (entry of history(); track entry.id) {
      <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">
          {{ entry.projectName }}
        </p>
        <p class="mt-1 text-sm font-medium text-slate-900 dark:text-slate-100">{{ entry.question }}</p>

        @if (entry.results.length === 0) {
          <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">No results.</p>
        } @else {
          <ul class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
            @for (result of entry.results; track result.id) {
              <li>
                <button
                  type="button"
                  (click)="openResult(result)"
                  class="flex h-full w-full flex-col items-start rounded-md border border-slate-200 px-3 py-2 text-left text-sm hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700"
                >
                  <span class="block w-full truncate font-mono text-slate-800 dark:text-slate-200">{{ result.sourceFile ?? 'Unknown file' }}</span>
                  <span class="mt-0.5 block text-xs text-slate-500 dark:text-slate-400">
                    {{ result.kind }}
                    @if (result.typeName) {
                      &middot; {{ result.typeName }}
                    }
                    &middot; similarity {{ result.similarity | number: '1.0-3' }}
                  </span>
                </button>
              </li>
            }
          </ul>
        }
      </article>
    }
  </section>
</div>

<div class="w-full max-w-sm rounded-lg bg-white p-5 shadow-xl dark:bg-slate-800">
  <p class="text-sm text-slate-700 dark:text-slate-200">{{ data.message }}</p>

  <div class="mt-4 flex justify-end gap-2">
    <button
      type="button"
      (click)="cancel()"
      class="rounded-md px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="confirm()"
      class="rounded-md bg-rose-600 px-3 py-1.5 text-sm text-white hover:bg-rose-700"
    >
      {{ confirmLabel }}
    </button>
  </div>
</div>

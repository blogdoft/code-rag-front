@for (toast of toastService.toasts(); track toast.id) {
  <div
    role="status"
    class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-md px-4 py-3 text-sm text-white shadow-lg"
    [class.bg-emerald-600]="toast.kind === 'success'"
    [class.bg-rose-600]="toast.kind === 'error'"
  >
    <span class="flex-1">{{ toast.message }}</span>
    <button
      type="button"
      (click)="toastService.dismiss(toast.id)"
      class="shrink-0 opacity-80 hover:opacity-100"
      aria-label="Dismiss notification"
    >
      &times;
    </button>
  </div>
}

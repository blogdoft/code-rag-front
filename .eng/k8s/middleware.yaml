# Strips the /code-brain path segment before Traefik forwards the request to this service, since
# /code-brain is a routing-only prefix on the shared blogdoft.home.arpa host - nginx.conf.template
# serves everything (the SPA, its static assets, version.json) as if mounted at "/", unaware of
# the prefix. Mirrors code-ciir-api-strip-code-brain / code-ciir-indexer-strip-code-brain
# (code-ciir-api's and code-ciir-indexer's own .eng/k8s/middleware.yaml). Referenced from
# ingress.yaml via the traefik.ingress.kubernetes.io/router.middlewares annotation.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: code-rag-front-strip-code-brain
spec:
  stripPrefix:
    prefixes:
      - /code-brain

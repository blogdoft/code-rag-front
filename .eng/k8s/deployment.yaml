apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-rag-front
  labels:
    app: code-rag-front
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: code-rag-front
  template:
    metadata:
      labels:
        app: code-rag-front
    spec:
      containers:
        - name: code-rag-front
          # image name/tag is stamped by the docker-publish.yml workflow (kustomize edit
          # set image) before this directory is synced to argo-local-apps - the value
          # here is never actually deployed as-is.
          image: code-rag-front
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # Where nginx reverse-proxies /api/... and /version to, same variable as
            # .eng/docker/docker-compose.yml (see nginx.conf.template). Since the front moved onto
            # the shared blogdoft.home.arpa/code-brain gateway (ingress.yaml), Traefik's own
            # code-ciir-api/code-ciir-indexer Ingress rules already intercept
            # /code-brain/api/code-queries* and /code-brain/api/indexer* before they ever reach
            # this pod - so this upstream now mainly matters for /version, which has no dedicated
            # gateway route of its own. Deliberately a direct in-cluster Service DNS name (not the
            # public gateway host) - pointing this at blogdoft.home.arpa/code-brain instead would
            # route back through Traefik's own /code-brain catch-all into this same Deployment,
            # looping nginx's proxy_pass into itself.
            - name: API_UPSTREAM
              value: http://code-ciir-api.code-brain.svc.cluster.local
            # Whether the app requires a Keycloak login - see
            # .specs/2026-09-21-keycloak-conditional-login.md. Same realm/host as code-ciir-api's
            # own Keycloak__Authority (code-ciir-api/.eng/k8s/configmap.yaml) - one shared realm
            # for every code-brain service. "code-brain" is a public client (PKCE, no secret)
            # already registered in that realm for this frontend, with Valid Redirect URIs covering
            # https://blogdoft.home.arpa/code-brain/*. NOTE: unlike some other environment-specific
            # values, this can't be overridden via a patch in argo-local-apps - docker-publish.yml's
            # sync step does `rm -rf` + `cp -r` on manifests/code-brain/code-rag-front/ on every tag push, so
            # this file's values ARE what's actually deployed; change them here, not there.
            - name: KEYCLOAK_ENABLED
              value: "true"
            - name: KEYCLOAK_URL
              value: "https://keycloak.home.arpa"
            - name: KEYCLOAK_REALM
              value: "k8s"
            - name: KEYCLOAK_CLIENT_ID
              value: "code-brain"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20

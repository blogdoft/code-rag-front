# Builds the frontend Docker image (.eng/docker/Dockerfile), publishes it to this repo's
# Forgejo Container Registry, and deploys it by stamping the version onto .eng/k8s/ and
# pushing the result into the argo-local-apps GitOps repo (manifests/code-brain/code-rag-front/) -
# ArgoCD takes it from there. Mirrors code-rag-api's docker-publish.yml, adapted for
# Angular/Node.
#
# Plain `docker build`/`docker push` (no buildx) is deliberate: buildx's containerized
# builder doesn't inherit the runner host's trust store, so pushing to forgejo.home.arpa
# (a private-CA certificate, see CLAUDE.md's TLS note) fails TLS verification there even
# though the host's own Docker daemon already trusts it - confirmed by code-rag-api's
# pipeline, which pushes fine with plain docker commands.
#
# Versioning is entirely manual: the app's version IS whatever tag you create and push
# (`git tag v1.2.3 && git push origin v1.2.3`). Unlike code-rag-api, this workflow never
# runs on a plain push to main, so there's no separate "latest"/"main-<sha>" floating tag -
# every trigger is already a unique, meaningful version.
#
# Requires, under Settings > Actions:
#   - Variables: REGISTRY, REGISTRY_IMAGE (= code-rag-front), REGISTRY_USERNAME
#   - Secrets: REGISTRY_PASSWORD (a token with package-write scope for this registry),
#     ARGO_DEPLOY_SSH_KEY (an SSH private key registered as a write-access deploy key on
#     argo-local-apps.git)
#
# The `ciir` job analyzes this repository with the published code-brain-angular npm CLI (dogfooding,
# same idea as that repository's own `ciir` job in its ci.yml) and, once tests pass, runs in
# parallel with `publish`/`update-gitops` - it neither depends on nor blocks the image build/deploy
# path. It sends the resulting ciir.jsonl to the code-ciir-indexer only when CIIR_BASE_URL is
# configured, so a repository without the indexer settings still gets a green pipeline. Needs the
# repo/org variables CIIR_BASE_URL, CIIR_PROJECT_ID (this repository's own project id in the
# indexer) and CIIR_CLIENT_ID, and the repo secret CIIR_CLIENT_SECRET (a confidential Keycloak
# client with Service accounts enabled) - see .specs/2026-09-28-self-indexing-ci.md.
#
# No artifact-upload step here on purpose: this self-hosted runner's cached node binary
# (actions/setup-node's tool_cache) can go missing again by the time a later step needs it - the
# `test` job's own Post-checkout/Post-setup-node cleanup hits the same "no such file" error and
# survives it (post-step failures don't fail a job), but a *main* step depending on node run after
# the CLI (e.g. an artifact upload) does fail the job for real. Confirmed on v1.12.1's run: the CLI
# itself succeeded (838 records sent, uploadId returned) both times, but the job still went red
# solely because of the artifact-upload step that used to follow it.

name: Docker publish

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test -- --watch=false

  publish:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the container registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USERNAME }}" --password-stdin

      - name: Determine image tag
        id: tag
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.tag.outputs.tag }}" \
            -t "${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${{ steps.tag.outputs.tag }}" \
            -f .eng/docker/Dockerfile .

      - name: Push image
        run: docker push "${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${{ steps.tag.outputs.tag }}"

  ciir:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Without node_modules, imports of npm packages end up as unresolved relations
      # (code-brain-angular's own README).
      - name: Install dependencies
        run: npm ci

      - name: Analyze this repository with code-brain-angular
        env:
          CIIR_BASE_URL: ${{ vars.CIIR_BASE_URL }}
          CIIR_PROJECT_ID: ${{ vars.CIIR_PROJECT_ID }}
          CIIR_CLIENT_ID: ${{ vars.CIIR_CLIENT_ID }}
          CIIR_CLIENT_SECRET: ${{ secrets.CIIR_CLIENT_SECRET }}
          CIIR_NOLOGO: "1"
        run: |
          args=(. --output ciir-output --fail-on-error --no-progress)
          if [[ -n "$CIIR_BASE_URL" ]]; then
            args+=(--send "$CIIR_BASE_URL" --projectId "$CIIR_PROJECT_ID" --clientId "$CIIR_CLIENT_ID" --clientSecret "$CIIR_CLIENT_SECRET" --insecure)
          fi
          npx --yes code-brain-angular@latest "${args[@]}"
        shell: bash

  update-gitops:
    needs: publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        # The install script uses $GITHUB_TOKEN (if set) to authenticate against the real
        # github.com API - but Forgejo injects its own GITHUB_TOKEN into every job's
        # environment (for GitHub Actions compatibility), which github.com rejects. Clear it
        # for this step only.
        #
        # This runner executes job steps directly on its own filesystem (no per-job
        # container), so /tmp persists across runs - skip reinstalling if a previous run
        # already put a binary there (the script refuses to overwrite one anyway).
        env:
          GITHUB_TOKEN: ""
        run: |
          if [ ! -x /tmp/kustomize-bin/kustomize ]; then
            mkdir -p /tmp/kustomize-bin
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /tmp/kustomize-bin
          fi
          echo "/tmp/kustomize-bin" >> "$GITHUB_PATH"

      - name: Stamp image into manifests
        run: |
          cd .eng/k8s
          kustomize edit set image "code-rag-front=${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${{ needs.publish.outputs.tag }}"

      # The runner's job steps execute directly in the (Alpine-based) runner image, which
      # doesn't ship an SSH client.
      - name: Install openssh-client
        run: apk add --no-cache openssh-client

      # ARGO_DEPLOY_SSH_KEY is a repo secret: the private half of a deploy key with write
      # access added to sauron/argo-local-apps in Forgejo (Settings > Deploy keys, "Read and
      # Write" enabled). ssh-keyscan trusts the host on first connect - argo-local-apps and
      # this runner are on the same private network, so TOFU is acceptable here.
      - name: Configure SSH
        run: |
          echo "${{ secrets.ARGO_DEPLOY_SSH_KEY }}" > "${{ github.workspace }}/.ssh-key"
          chmod 600 "${{ github.workspace }}/.ssh-key"
          ssh-keyscan -p 2222 forgejo.home.arpa > "${{ github.workspace }}/.ssh-known-hosts" 2>/dev/null

      - name: Sync manifests to argo-local-apps
        env:
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.ssh-key -o UserKnownHostsFile=${{ github.workspace }}/.ssh-known-hosts
        run: |
          WORKDIR=$(mktemp -d)
          git clone --depth 1 ssh://git@forgejo.home.arpa:2222/sauron/argo-local-apps.git "$WORKDIR"

          rm -rf "$WORKDIR/manifests/code-brain/code-rag-front"
          mkdir -p "$WORKDIR/manifests/code-brain/code-rag-front"
          cp -r .eng/k8s/. "$WORKDIR/manifests/code-brain/code-rag-front/"

          cd "$WORKDIR"
          git config user.name "code-rag-ci"
          git config user.email "ci@code-rag.local"
          git add manifests/code-brain/code-rag-front

          if git diff --cached --quiet; then
            echo "No manifest changes, skipping commit."
          else
            git commit -m "chore(code-rag-front): deploy ${{ needs.publish.outputs.tag }}"
            git push origin main
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f "${{ github.workspace }}/.ssh-key" "${{ github.workspace }}/.ssh-known-hosts"

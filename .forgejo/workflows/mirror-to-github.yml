# Mirrors this repository to GitHub on every push (all branches and tags, deleting on the
# GitHub side anything removed here). Requires a Forgejo repo secret configured in
# Settings > Actions > Secrets:
#   MIRROR_GITHUB_TOKEN - a GitHub Personal Access Token (classic, "repo" scope, or
#   fine-grained with "Contents: read and write") for an account with push access to
#   https://github.com/blogdoft/code-rag-front. Mirrors code-rag-api's
#   mirror-to-github.yml.

name: Mirror to GitHub

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          # Force-refspec (not the --tags shorthand) for tags: actions/checkout@v4, when
          # triggered by a tag push, already leaves a local refs/tags/<tag> pointing straight
          # at the commit. Our tags are annotated, so origin's real tag object has a different
          # SHA - a plain `--tags` fetch treats that as a non-fast-forward update and refuses
          # it ("would clobber existing tag") instead of updating the local ref.
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git update-ref -d refs/remotes/origin/HEAD 2>/dev/null || true

      - name: Push mirror to GitHub
        run: |
          git push --prune "https://x-access-token:${{ secrets.MIRROR_GITHUB_TOKEN }}@github.com/blogdoft/code-rag-front.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
